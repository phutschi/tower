name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # tower runs on Node >= 22.12, and the runner's own Node may be older;
      # npm comes with it (./test.sh runs npm scripts in its fixtures).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: node dist/cli.js --help
      # The kit: shell lint (shellcheck ships on the Linux runner), then its
      # tests, which run the tower from this checkout.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning *.sh skills/*/*.sh skills/orchestrate/tests/stub/*
      - name: kit tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          ./test.sh
